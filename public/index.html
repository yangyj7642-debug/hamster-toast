// ── SDK fallback (테스트용) ─────────────────────────
async function submitScore(score) {
  console.log('[테스트] 점수 제출:', score);
  showToast('점수 ' + score + '점 제출! (테스트 모드)');
}
async function openLeaderboard() {
  console.log('[테스트] 리더보드 열기');
  shareScore();
}

// ── 사운드 시스템 ───────────────────────────────────
let bgmAudio = null;
let bgmStarted = false;

function initBGM() {
  if (bgmStarted) return;
  bgmStarted = true;
  bgmAudio = new Audio('data:audio/mp3;base64,__BGM_BASE64__');
  bgmAudio.loop = true;
  bgmAudio.volume = 0.4;
  bgmAudio.play().catch(e => console.warn('BGM play failed', e));
}

function stopBGM() {
  if (bgmAudio) { bgmAudio.pause(); bgmAudio.currentTime = 0; }
}

let audioCtx = null;
function getACtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playEatSound() {
  const ctx = getACtx();
  if (ctx.state === 'suspended') { ctx.resume(); return; }
  const t = ctx.currentTime;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.connect(g); g.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(520, t);
  osc.frequency.exponentialRampToValueAtTime(1100, t + 0.15);
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  osc.start(t); osc.stop(t + 0.22);
}

function playHitSound() {
  const ctx = getACtx();
  if (ctx.state === 'suspended') { ctx.resume(); return; }
  const t = ctx.currentTime;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.connect(g); g.connect(ctx.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.exponentialRampToValueAtTime(60, t + 0.18);
  g.gain.setValueAtTime(0.6, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  osc.start(t); osc.stop(t + 0.22);
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*0.3;
  const src = ctx.createBufferSource(), ng = ctx.createGain();
  src.buffer = buf; src.connect(ng); ng.connect(ctx.destination);
  ng.gain.setValueAtTime(0.35, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  src.start(t);
}

canvas.width=W*DPR;canvas.height=H*DPR;
canvas.style.width=W+'px';canvas.style.height=H+'px';
ctx.scale(DPR,DPR);
ctx.imageSmoothingEnabled=true;
ctx.imageSmoothingQuality='high';

const imgC=new Image();imgC.src='data:image/png;base64,'+C64;
const imgO=new Image();imgO.src='data:image/png;base64,'+O64;

let score=0,best=0,lives=3,gameState='ready';
const HAM_W=52,HAM_H=52;
const HAM_Y=H-62;
let hamX=W/2;
let hamBounce=0,eatAnim=0,failFlash=0,failShake=0,hitFlash=0;
let items=[],spawnTimer=30,particles=[];
let pointerDown=false,lastPX=0;
const keys={};

// ── 시간대 시스템 ──────────────────────────────────
// 0=낮, 1=노을, 2=밤, 3=새벽, 4=아침 → 다시 낮으로
let timeOfDay=0; // 0.0 ~ 5.0 (연속)
let timeSpeed=0.0004; // 아주 천천히

// 각 시간대 팔레트 [하늘상단, 하늘하단, 바닥, 구름알파]
const palettes=[
  // 낮
  {top:'#6ab4f5',bot:'#a8d8f8',ground:'#5aaa38',groundLine:'#48902a',cloud:0.9,stars:0},
  // 노을
  {top:'#e8602a',bot:'#f5a050',ground:'#7a4a20',groundLine:'#5a3410',cloud:0.7,stars:0.2},
  // 밤
  {top:'#0a0a2a',bot:'#141440',ground:'#181830',groundLine:'#0a0a20',cloud:0.15,stars:1.0},
  // 새벽
  {top:'#1a1050',bot:'#4a2870',ground:'#2a1840',groundLine:'#1a0e2e',cloud:0.3,stars:0.6},
  // 아침
  {top:'#f0c840',bot:'#f8e080',ground:'#60a830',groundLine:'#4a8820',cloud:0.8,stars:0.0},
];

function lerpColor(c1,c2,t){
  const p1=parseInt,h=s=>s.replace('#','');
  const r1=p1(h(c1).slice(0,2),16),g1=p1(h(c1).slice(2,4),16),b1=p1(h(c1).slice(4,6),16);
  const r2=p1(h(c2).slice(0,2),16),g2=p1(h(c2).slice(2,4),16),b2=p1(h(c2).slice(4,6),16);
  const r=Math.round(r1+(r2-r1)*t);
  const g=Math.round(g1+(g2-g1)*t);
  const b=Math.round(b1+(b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}

function getPalette(){
  const idx=Math.floor(timeOfDay)%palettes.length;
  const next=(idx+1)%palettes.length;
  const t=timeOfDay%1;
  const a=palettes[idx],b=palettes[next];
  return {
    top:   lerpColor(a.top,b.top,t),
    bot:   lerpColor(a.bot,b.bot,t),
    ground:lerpColor(a.ground,b.ground,t),
    groundLine:lerpColor(a.groundLine,b.groundLine,t),
    cloud: a.cloud+(b.cloud-a.cloud)*t,
    stars: a.stars+(b.stars-a.stars)*t,
  };
}

// 별 고정 위치
const STARS=Array.from({length:60},()=>({
  x:Math.random()*W,
  y:10+Math.random()*(H*0.55),
  r:0.5+Math.random()*1.5,
  twinkle:Math.random()*Math.PI*2
}));

const BAD=['💣','🍫','🍄','💩'];
function spawnInterval(){return Math.max(26,82-score*1.8);}
function baseFallSpeed(){return Math.min(1.9+score*0.12,7);}
function badChance(){return Math.min(0.15+score*0.014,0.48);}

function spawnItem(){
  const bad=Math.random()<badChance();
  const emoji=bad?BAD[~~(Math.random()*BAD.length)]:'🥪';
  items.push({x:44+Math.random()*(W-88),y:-52,emoji,bad,size:52,
    angle:(Math.random()-0.5)*0.3,spin:(Math.random()-0.5)*0.04,
    speed:baseFallSpeed()*(bad?0.8+Math.random()*0.4:1)});
}

function initGame(){
  score=0;lives=3;hamX=W/2;
  timeOfDay=0; // 낮으로 리셋
  hamBounce=0;eatAnim=0;failFlash=0;failShake=0;hitFlash=0;
  items=[];particles=[];spawnTimer=30;gameState='playing';
  stopBGM();
  bgmStarted = false;
  initBGM();
}

const emojiCache={};
function drawEmoji(emoji,size,x,y,angle){
  const key=emoji+'_'+size;
  if(!emojiCache[key]){
    const oc=document.createElement('canvas');
    const s=size*4;oc.width=s;oc.height=s;
    const c=oc.getContext('2d');
    c.font=`${Math.round(s*0.8)}px serif`;
    c.textAlign='center';c.textBaseline='middle';
    c.fillText(emoji,s/2,s/2);
    emojiCache[key]=oc;
  }
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  ctx.drawImage(emojiCache[key],-size/2,-size/2,size,size);
  ctx.restore();
}

// ── BG ────────────────────────────────────────────
function drawBg(){
  const p=getPalette();

  // 하늘
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,p.top);
  g.addColorStop(1,p.bot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // 별
  if(p.stars>0.05){
    STARS.forEach(s=>{
      s.twinkle+=0.03;
      const alpha=p.stars*(0.5+0.5*Math.sin(s.twinkle));
      ctx.fillStyle=`rgba(255,255,220,${alpha.toFixed(2)})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    });
  }

  // 달 (밤~새벽)
  if(p.stars>0.3){
    const moonAlpha=Math.min(1,(p.stars-0.3)/0.7);
    ctx.save();
    ctx.globalAlpha=moonAlpha*0.9;
    ctx.fillStyle='#fffff0';
    ctx.beginPath();ctx.arc(300,80,22,0,Math.PI*2);ctx.fill();
    // 달 그림자
    ctx.fillStyle=p.top;
    ctx.beginPath();ctx.arc(308,76,20,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // 태양 (낮~아침)
  if(p.stars<0.2){
    const sunAlpha=1-p.stars*5;
    const sunY = timeOfDay%1<0.5 ? 70+timeOfDay%1*40 : 70+(1-timeOfDay%1)*40;
    ctx.save();
    ctx.globalAlpha=sunAlpha*0.9;
    ctx.fillStyle='#ffe040';
    ctx.beginPath();ctx.arc(60,70,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,220,50,0.3)';
    ctx.beginPath();ctx.arc(60,70,28,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // 노을 태양
  if(timeOfDay%5>0.8&&timeOfDay%5<1.5){
    const t=1-(Math.abs(timeOfDay%5-1.15)/0.35);
    if(t>0){
      ctx.save();ctx.globalAlpha=t*0.85;
      ctx.fillStyle='#ff6020';
      ctx.beginPath();ctx.arc(W/2,H-52,36,Math.PI,0);ctx.fill();
      ctx.fillStyle='rgba(255,120,30,0.3)';
      ctx.beginPath();ctx.arc(W/2,H-52,55,Math.PI,0);ctx.fill();
      ctx.restore();
    }
  }

  // 구름
  if(p.cloud>0.05){
    ctx.fillStyle=`rgba(255,255,255,${p.cloud.toFixed(2)})`;
    drawCloud(80,72,34);
    drawCloud(272,92,26);
    drawCloud(176,48,20);
  }

  // 건물 실루엣 (바닥 위, 반투명)
  drawBuildings(p);

  // 바닥
  ctx.fillStyle=p.ground;ctx.fillRect(0,H-52,W,52);
  ctx.fillStyle=p.groundLine;ctx.fillRect(0,H-54,W,4);
}

function drawBuildings(p){
  // 시간대별 건물 색상
  const t = timeOfDay % 5;
  let wallA, winA, winColor;
  if(t < 1) {      // 낮
    wallA=0.12; winA=0.0; winColor='#fffbe0';
  } else if(t < 2) { // 노을
    wallA=0.18; winA=0.10; winColor='#ffcc44';
  } else if(t < 3) { // 밤
    wallA=0.38; winA=0.32; winColor='#ffe066';
  } else if(t < 4) { // 새벽
    wallA=0.35; winA=0.28; winColor='#aad4ff';
  } else {           // 아침
    wallA=0.18; winA=0.1; winColor='#fff5cc';
  }

  // 건물 데이터 [x, groundY, width, height, floors, hasAntenna]
  const buildings = [
    [10,  H-52, 38, 140, 4, false],
    [42,  H-52, 28, 100, 3, false],
    [64,  H-52, 48, 190, 6, true ],
    [106, H-52, 22,  80, 2, false],
    [122, H-52, 36, 120, 3, false],
    [188, H-52, 26,  90, 2, false],
    [208, H-52, 52, 210, 7, true ],
    [254, H-52, 30, 150, 4, false],
    [278, H-52, 44, 170, 5, true ],
    [316, H-52, 28,  95, 3, false],
    [338, H-52, 38, 130, 4, false],
  ];

  buildings.forEach(([x, gy, bw, bh, floors, antenna]) => {
    const bx = x;
    const by = gy - bh;

    // 건물 본체
    ctx.fillStyle = `rgba(40,40,60,${wallA})`;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, [3,3,0,0]);
    ctx.fill();

    // 창문
    if(winA > 0.05) {
      const ww = Math.max(4, bw*0.22);
      const wh = Math.max(5, bh*0.09);
      const cols = Math.floor(bw / (ww + 5));
      const rows = floors;
      const padX = (bw - cols*(ww+4)) / 2;

      for(let row=0; row<rows; row++) {
        for(let col=0; col<cols; col++) {
          // 밤엔 랜덤하게 불 꺼진 창문
          const lit = t>1&&t<4 ? (Math.sin(x*7.3+row*3.1+col*5.7)>-0.3) : true;
          if(!lit) continue;
          const wx = bx + padX + col*(ww+4);
          const wy = by + wh*1.5 + row*(wh+6);
          if(wy+wh > gy-4) continue;
          ctx.fillStyle = `rgba(${winColor.replace('#','').match(/.{2}/g).map(h=>parseInt(h,16)).join(',')},${winA})`;
          ctx.beginPath();
          ctx.roundRect(wx, wy, ww, wh, 1);
          ctx.fill();
        }
      }
    }

    // 안테나
    if(antenna) {
      ctx.strokeStyle = `rgba(40,40,60,${wallA*1.2})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(bx+bw/2, by);
      ctx.lineTo(bx+bw/2, by-22);
      ctx.stroke();
      // 안테나 끝 점
      ctx.fillStyle = t>1&&t<4 ? `rgba(255,80,80,0.8)` : `rgba(40,40,60,${wallA})`;
      ctx.beginPath();
      ctx.arc(bx+bw/2, by-22, 2, 0, Math.PI*2);
      ctx.fill();
    }
  });
}

function drawCloud(cx,cy,r){
  ctx.beginPath();
  ctx.arc(cx,      cy,      r,      0,Math.PI*2);
  ctx.arc(cx+r*0.9,cy+r*0.15,r*0.7, 0,Math.PI*2);
  ctx.arc(cx-r*0.9,cy+r*0.15,r*0.65,0,Math.PI*2);
  ctx.arc(cx+r*0.35,cy-r*0.55,r*0.6,0,Math.PI*2);
  ctx.arc(cx-r*0.3,cy-r*0.5,r*0.55, 0,Math.PI*2);
  ctx.fill();
}

// ── HUD ───────────────────────────────────────────
function drawHUD(){
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.beginPath();ctx.roundRect(W/2-58,12,116,42,21);ctx.fill();
  ctx.fillStyle='#333';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
  ctx.fillText('🥪 '+score,W/2,40);
  if(best>0){ctx.fillStyle='rgba(0,0,0,0.4)';ctx.font='11px sans-serif';ctx.fillText('최고 '+best,W/2,58);}
  ctx.font='22px sans-serif';ctx.textAlign='right';
  let h='';for(let i=0;i<3;i++)h+=(i<lives?'❤️':'🖤');
  ctx.fillText(h,W-12,40);
}

// ── Hamster ───────────────────────────────────────
function drawHamster(){
  if(hamBounce>0)hamBounce=Math.max(0,hamBounce-0.14);
  if(eatAnim>0)eatAnim--;
  if(failShake>0)failShake--;
  if(hitFlash>0)hitFlash--;
  const by=Math.sin(hamBounce*Math.PI)*5;
  const sx=failShake>0?(Math.random()-0.5)*8*(failShake/22):0;
  const cx=hamX+sx,cy=HAM_Y+by;

  ctx.fillStyle='rgba(0,0,0,0.08)';
  ctx.beginPath();ctx.ellipse(cx,HAM_Y+HAM_H*0.5,HAM_W*0.38,6,0,0,Math.PI*2);ctx.fill();

  if(hitFlash>0){
    ctx.save();ctx.globalAlpha=hitFlash/20*0.35;
    ctx.fillStyle='#ff4444';
    ctx.beginPath();ctx.ellipse(cx,cy,HAM_W/2,HAM_H/2,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  const img=eatAnim>0?imgO:imgC;
  if(img.complete&&img.naturalWidth>0){
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    // closed=HAM_W, open=더 크게
    const sz = eatAnim>0 ? HAM_W*1.8 : HAM_W*1.05;
    ctx.drawImage(img,cx-sz/2,cy-sz*0.52,sz,sz);
  }
}

// ── Items ─────────────────────────────────────────
function updateItems(){
  items=items.filter(it=>{
    it.y+=it.speed;it.angle+=it.spin;
    const mx=hamX,my=HAM_Y-HAM_H*0.1;
    const hw=HAM_W*0.32;
    const inX=Math.abs(it.x-mx)<hw;
    const inY=it.y+it.size*0.45>my-10&&it.y-it.size*0.45<my+16;
    if(inX&&inY){
      if(!it.bad){
        score++;if(score>best)best=score;
        hamBounce=1;eatAnim=22;
        playEatSound();
        spawnParticles(it.x,it.y,'good');
      }else{
        lives--;hitFlash=20;failShake=18;failFlash=16;
        playHitSound();
        spawnParticles(it.x,it.y,'bad');
        if(lives<=0)setTimeout(()=>{gameState='gameover';stopBGM();submitScore(score);},400);
      }
      return false;
    }
    if(it.y>H+50){
      if(!it.bad){lives--;failFlash=14;failShake=14;playHitSound();if(lives<=0)setTimeout(()=>{gameState='gameover';stopBGM();submitScore(score);},400);}
      return false;
    }
    drawEmoji(it.emoji,it.size,it.x,it.y,it.angle);
    return true;
  });
}

function spawnParticles(x,y,type){
  const cols=type==='good'?['#ffd700','#ff8c42','#ff6b9d','#a8e6cf','#ffd93d']:['#ff4444','#ff8800','#ffcc00'];
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,life:1,color:cols[~~(Math.random()*cols.length)],r:3+Math.random()*4});
  }
}
function updateParticles(){
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.14;p.life-=0.026;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.1,p.r*p.life),0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;return p.life>0;
  });
}

function drawBtn(x,y,w,h,txt,bg,fg){
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x,y,w,h,14);ctx.fill();
  ctx.fillStyle=fg;ctx.font='bold 16px sans-serif';ctx.textAlign='center';
  ctx.fillText(txt,x+w/2,y+h/2+6);
}
function drawPanel(x,y,w,h){
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.beginPath();ctx.roundRect(x,y,w,h,24);ctx.fill();
  ctx.strokeStyle='rgba(100,100,200,0.2)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(x,y,w,h,24);ctx.stroke();
}

// ── Main loop ─────────────────────────────────────
function shareScore(){
  const txt = `🐹 토스트를 네 입에 토스\n🥪 ${score}개 먹었어요!${score===best?' 🏆 신기록!':''}\n\n나도 해볼래? 👉 ${location.href}`;
  if(navigator.share){
    navigator.share({title:'hamster-toast', text:txt, url:location.href})
      .catch(()=>copyToClipboard(txt));
  } else {
    copyToClipboard(txt);
  }
}

function copyToClipboard(txt){
  navigator.clipboard.writeText(txt).then(()=>{
    showToast('클립보드에 복사됐어요! 📋');
  }).catch(()=>{
    // 로컬 파일 등 clipboard API 막힌 경우 → prompt로 fallback
    prompt('아래 텍스트를 복사하세요!', txt);
  });
}

let toastMsg='', toastTimer=0;
function showToast(msg){
  toastMsg=msg; toastTimer=120;
}

function frame(){
  // 시간 흐르기 (게임 중일 때만)
  if(gameState==='playing') timeOfDay+=timeSpeed;

  if(gameState==='playing'){
    if(keys['ArrowLeft']||keys['a'])hamX=Math.max(HAM_W/2,hamX-5.5);
    if(keys['ArrowRight']||keys['d'])hamX=Math.min(W-HAM_W/2,hamX+5.5);
  }

  ctx.clearRect(0,0,W,H);
  drawBg();

  if(failFlash>0){
    ctx.fillStyle=`rgba(255,40,40,${(failFlash/16)*0.28})`;
    ctx.fillRect(0,0,W,H);failFlash--;
  }

  drawHUD();
  drawHamster();

  if(gameState==='playing'){
    spawnTimer--;
    if(spawnTimer<=0){spawnItem();spawnTimer=spawnInterval();}
    updateItems();
    updateParticles();
  }

  // 클립보드 복사 알림 토스트
  if(toastTimer>0){
    toastTimer--;
    const alpha=Math.min(1,toastTimer/20);
    ctx.fillStyle=`rgba(30,30,30,${alpha*0.85})`;
    ctx.beginPath();ctx.roundRect(W/2-100,H/2-20,200,40,12);ctx.fill();
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText(toastMsg,W/2,H/2+5);
  }
  if(gameState==='ready')    drawReady();
  if(gameState==='gameover') drawGameOver();
  requestAnimationFrame(frame);
}

function getXY(e){
  const r=canvas.getBoundingClientRect();
  const src=e.touches?e.touches[0]:e;
  return {x:(src.clientX-r.left)*(W/r.width),y:(src.clientY-r.top)*(H/r.height)};
}
function unlockAudio() {
  // 첫 터치 시 AudioContext 강제 생성 및 활성화
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  // 게임 중이면 BGM도 여기서 한번 더 시도
  if (gameState === 'playing' && bgmAudio && bgmAudio.paused) {
    bgmAudio.play().catch(()=>{});
  }
}

function onDown(e){
  unlockAudio();
  const p=getXY(e);
  if(gameState==='ready'&&p.x>W/2-70&&p.x<W/2+70&&p.y>368&&p.y<414){initGame();return;}
  if(gameState==='gameover'&&p.x>W/2-72&&p.x<W/2+72&&p.y>300&&p.y<344){initGame();return;}
  if(gameState==='gameover'&&p.x>W/2-72&&p.x<W/2+72&&p.y>352&&p.y<396){openLeaderboard();return;}
  pointerDown=true;lastPX=p.x;
}
function onMove(e){
  if(!pointerDown||gameState!=='playing') return;
  const p=getXY(e);
  hamX=Math.max(HAM_W/2,Math.min(W-HAM_W/2,hamX+(p.x-lastPX)));
  lastPX=p.x;
}
function onUp(){pointerDown=false;}

canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();onUp();},{passive:false});
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);

// ── 백그라운드 감지 ──────────────────────────────────
document.addEventListener('visibilitychange', () => {
  if (!bgmAudio) return;
  if (document.hidden) {
    bgmAudio.pause();
    if (audioCtx) audioCtx.suspend();
  } else {
    if (gameState === 'playing') {
      bgmAudio.play().catch(()=>{});
      if (audioCtx) audioCtx.resume();
    }
  }
});

frame();
</script>
